name: Build & Push - Auth Service

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'infra/**'
      - '.github/workflows/terraform-*.yml'
      - 'k8s/**'
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: us-east-1
  ECR_REGISTRY: 103568492404.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: toggle-master-dev/auth-service

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Lint - golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=3m

      - name: SAST - gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence high -quiet ./... || true

      - name: SCA - govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: SCA - Trivy (vulnerabilidades criticas)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Login to ECR
        run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build image
        run: docker build -t $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }} -t $ECR_REGISTRY/$IMAGE_NAME:latest .

      - name: Push image
        run: docker push $ECR_REGISTRY/$IMAGE_NAME --all-tags

      - name: Update deployment manifest
        run: |
          sed -i "s|image: .*|image: $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: atualizar tag da imagem para ${{ github.sha }}"
          git push
